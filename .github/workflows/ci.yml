name: CI

# Layout: this repository is checked out under wallet/ and MinervaQuantum/minerva-network under
# network/, because the pnpm `link:` overrides in package.json point at ../network/packages/*.
# The network packages are built before the wallet install so their dist/ exists.
defaults:
  run:
    working-directory: wallet

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: typecheck · lint · contracts · extension
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: wallet
      - name: Checkout minerva-network (linked packages)
        uses: actions/checkout@v4
        with:
          repository: MinervaQuantum/minerva-network
          ref: main
          path: network

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            wallet/pnpm-lock.yaml
            network/pnpm-lock.yaml

      - name: Build network packages
        working-directory: network
        run: |
          pnpm install --frozen-lockfile --filter "./packages/**"
          pnpm --filter "./packages/**" run build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Build extension
        run: pnpm --filter @minerva/extension build

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Contract tests
        run: forge test --root packages/contracts -vvv
