name: Snapcraft

# Manual only. snapcraft builds from this directory alone, so the pnpm `link:` overrides that
# point at ../network/packages/* (the MinervaQuantum/minerva-network repository) cannot resolve
# inside the build container; the snap recipe needs those packages vendored before this can run on
# tags again. Linux users get the .deb and AppImage from the Release workflow meanwhile.
defaults:
  run:
    working-directory: wallet

on:
  workflow_dispatch:
    inputs:
      release:
        description: Snap Store channel to publish to when publish is enabled.
        required: true
        default: edge
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable
      publish:
        description: Upload the built snap to the selected Snap Store channel.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  snap:
    name: build snap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: wallet

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: wallet

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: minerva-wallet-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

      - name: Publish snap
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: ${{ inputs.release }}
